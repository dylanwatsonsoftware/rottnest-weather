<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rottnest Snorkelling</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
</head>
<body>
    <header>
        <h1>Rottnest Snorkelling</h1>
        <div id="weather-panel">
            <div id="wind-arrow-container">
                <svg id="wind-arrow" viewBox="0 0 24 24">
                    <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
                </svg>
            </div>
            <div id="weather-info">
                <p>Loading weather data...</p>
            </div>
        </div>
    </header>
    <main>
        <div id="map"></div>
        <div id="controls">
            <div class="slider-container">
                <label for="time-slider">Forecast Time: <span id="selected-time">Now</span></label>
                <input type="range" id="time-slider" min="0" max="47" value="0">
            </div>
            <div class="graph-container">
                <canvas id="windChart"></canvas>
            </div>
        </div>
    </main>
    <footer>
        <p>
            <span>🤿</span> OK Snorkeling &nbsp; | &nbsp;
            <span>●</span> Unsuitable &nbsp; | &nbsp;
            <span>📍</span> Landmark &nbsp; | &nbsp;
            <span>🏪</span> Business
        </p>
        <p>Recommended snorkeling areas based on wind conditions. "OK" indicates suitable conditions.</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
